jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    nprocs:
      def: 6
      max: 6
    memory:
      max: 55000
      def: 55000
    gpus:
      def: gpu:1
      choices:
        - gpu:1

jupyterhub::kernel::venv::packages:
  - cupy==12.2.0
  - jax[cuda12]==0.4.34
  - torchvision==0.20.1
  - matplotlib==3.9.2
profile::freeipa::mokey::enable_user_signup: false
profile::freeipa::mokey::require_verify_admin: false
profile::software_stack::lmod_default_modules:
  - gcc
  - cuda/12.2

profile::accounts::skel_archives:
  - filename: master.zip
    source: https://github.com/calculquebec/cgpu101/archive/refs/heads/master.zip
  - filename: cifar-10-python.tar.gz
    source: https://www.cs.toronto.edu/~kriz/cifar-10-python.tar.gz
