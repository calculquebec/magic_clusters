jupyterhub::kernel::venv::python: /cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Compiler/gcccore/python/3.13.2/bin/python
jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    runtime:
      max: 8.0
      lock: true
    nprocs:
      max: 8
      lock: true
    memory:
      max: 8092
      def: 4048
      lock: true
    gpus:
      def: 'gpu:0'
      choices: ['gpu:0', 'gpu:1']
      lock: true
    oversubscribe:
      lock: true
    profile:
      def: 'PYT'
      choices: ['PYT', 'IA_CPU', 'IA_GPU']
    account:
      lock: true
    reservation:
      lock: true
    partition:
      def: 'cpubase_bycore_b1'
      lock: true
  SlurmFormSpawner:
    disable_form: false
    start_timeout: 900
    http_timeout: 900
    ui_args:
      lab:
        modules: ['jupyterlab-apps']
    profile_args:
      IA_CPU:
        name: 'Séquence IA - CPU'
        params:
          nprocs: 2
          runtime: 4
          memory: '2048'
          ui: 'lab'
          gpus: 'gpu:0'
          feature: ['cpu']
      IA_GPU:
        name: 'Séquence IA - GPU'
        params:
          nprocs: 2
          runtime: 4
          memory: '2048'
          oversubscribe: false
          ui: 'lab'
          gpus: 'gpu:1'
          feature: ['gpu']
      PYT:
        name: 'Séquence intro python'
        params:
          nprocs: 1
          runtime: 4
          memory: '1024'
          oversubscribe: false
          ui: 'lab'
          gpus: 'gpu:0'
          feature: ['cpu']

profile::freeipa::mokey::enable_user_signup: true
profile::freeipa::mokey::require_verify_admin: false

