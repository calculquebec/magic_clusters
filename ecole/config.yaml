jupyterhub::slurmformspawner::version: 2.11.1
jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    runtime:
      max: 8.0
      lock: true
    nprocs:
      max: 8
      lock: true
    memory:
      max: 8092
      def: 4048
      lock: true
    gpus:
      def: 'gpu:0'
      choices: ['gpu:0', 'gpu:1']
      lock: true
    oversubscribe:
      lock: true
    profile:
      def: 'PYT'
      choices: ['PYT', 'IA_CPU', 'IA_GPU']
    account:
      lock: true
    reservation:
      lock: true
    partition:
      def: 'cpubase_bycore_b1'
      lock: true
  SlurmFormSpawner:
    disable_form: false
    start_timeout: 900
    http_timeout: 900
    ui_args:
      lab:
        modules: ['jupyterlab-apps']
    profile_args:
      IA_CPU:
        name: 'Séquence IA - CPU'
        params:
          nprocs: 2
          runtime: 4
          memory: '2048'
          ui: 'lab'
      IA_GPU:
        name: 'Séquence IA - GPU'
        params: 
          nprocs: 2
          runtime: 4
          memory: '2048'
          oversubscribe: false
          ui: 'lab'
          gpus: 'gpu:1'
      PYT:
        name: 'Séquence intro python'
        params:
          nprocs: 1
          runtime: 4
          memory: '1024'
          oversubscribe: false
          ui: 'lab'

profile::software_stack::lmod_default_modules: ['StdEnv/2023', 'gcc', 'cuda/12.2', 'mpi4py/4.0.3', 'jupyterlab-apps/1.0']
jupyterhub::kernel::venv::packages:
  - numpy>2
  - pandas==2.2.3
  - matplotlib==3.10.0
  - plotnine==0.14.1
  - altair==5.4.1
  - vega_datasets
  - vl_convert_python
  - dask[array,distributed,diagnostics]==2025.2.0
  - graphviz
  - sparse
  - scipy==1.15.1
  - numba==0.61.2
  - torch==2.6.0
  - scikit-learn
  - pillow
  - pycuda==2025.1
  - torchvision

profile::freeipa::mokey::enable_user_signup: true
profile::freeipa::mokey::require_verify_admin: false

profile::accounts::skel_archives:
  - filename: cip101.zip
    source: https://github.com/calculquebec/cip101/archive/refs/heads/main.zip
  - filename: shell-lesson-data.zip
    source: https://swcarpentry.github.io/shell-novice/data/shell-lesson-data.zip
  - filename: cip202.zip
    source: https://github.com/calculquebec/cip202/archive/refs/heads/main.zip
  - filename: cip201.zip
    source: https://github.com/calculquebec/cip201/archive/refs/heads/main.zip
  - filename: dat201.zip
    source: https://github.com/calculquebec/dat201/archive/refs/heads/main.zip
  - filename: cq-formation-dask.zip
    source: https://github.com/calculquebec/cq-formation-dask/archive/refs/heads/main.zip
  - filename: mpi201.zip
    source: https://github.com/calculquebec/mpi201/archive/refs/heads/main.zip
  - filename: cq-intro-python-gpu.zip
    source: https://github.com/calculquebec/cq-intro-python-gpu/archive/refs/heads/main.zip
  - filename: intro-machine-learning.zip
    source: https://github.com/calculquebec/intro-machine-learning/archive/refs/heads/master.zip
  - filename: cq-formation-convolution.zip
    source: https://github.com/calculquebec/cq-formation-convolution/archive/refs/heads/main.zip
  - filename: cq-formation-ecoulement-chaleur.zip
    source: https://github.com/calculquebec/cq-formation-ecoulement-chaleur/archive/refs/heads/main.zip
  - filename: cq-formation-nbody.zip
    source: https://github.com/calculquebec/cq-formation-nbody/archive/refs/heads/main.zip
  - filename: PYT101-ecole_printemps_2025.zip
    source: https://github.com/calculquebec/PYT101-ecole_printemps_2025/archive/refs/heads/main.zip

cron::job:
  spawn_cpu_nodes:
    command: "/opt/software/slurm/bin/scontrol update node=cpupool[1-15] state=power_up"
    minute: '0'
    hour: '8'
    date: '19,20,21'
    month: '5'
    weekday: '*'
    user: 'root'
    description: 'spawn cpu nodes'
    environment: ['CRON_TZ=America/New_York']
  spawn_all_nodes:
    command: "/opt/software/slurm/bin/scontrol update node=ALL state=power_up"
    minute: '0'
    hour: '8'
    date: '22,23'
    month: '5'
    weekday: '*'
    user: 'root'
    description: 'spawn all nodes'
    environment: ['CRON_TZ=America/New_York']
