  - filename: PYT101-ecole_printemps_2025.zip
    source: https://github.com/calculquebec/PYT101-ecole_printemps_2025/archive/refs/heads/main.zip

cron::job:
  spawn_cpu_nodes:
    command: "/opt/software/slurm/bin/scontrol update node=nodecpupool[1-15] state=power_up"
    minute: '0'
    hour: '8'
    date: '19,20,21'
    month: '5'
    weekday: '*'
    user: 'root'
    description: 'spawn cpu nodes'
    environment: ['CRON_TZ=America/New_York']
  spawn_all_nodes:
    command: "/opt/software/slurm/bin/scontrol update node=ALL state=power_up"
    minute: '0'
    hour: '8'
    date: '22,23'
    month: '5'
    weekday: '*'
    user: 'root'
    description: 'spawn all nodes'
    environment: ['CRON_TZ=America/New_York']
