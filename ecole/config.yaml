jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    account:
      def: 'def-sponsor00'
    runtime:
      min: 3.5
      def: 4.0
      max: 8.0
    nprocs:
      min: 1
      def: 1
      max: 8
    memory:
      min: 1024
      max: 8092
      def: 4048
    gpus:
      def: 'gpu:0'
      choices: ['gpu:0', 'gpu:1']
    oversubscribe:
      def: true
      lock: false
    ui:
      def: 'lab'  # ['notebook', 'lab', 'terminal']
  SlurmFormSpawner:
    disable_form: false
    start_timeout: 900

profile::software_stack::lmod_default_modules: ['StdEnv/2023', 'gcc', 'cuda/12.2', 'mpi4py/4.0.3']
jupyterhub::kernel::venv::packages:
  - numpy>2
  - pandas==2.2.3
  - matplotlib==3.10.0
  - plotnine==0.14.1
  - altair==5.4.1
  - vega_datasets
  - vl_convert_python
  - dask[array,distributed,diagnostics]==2025.2.0
  - graphviz
  - sparse
  - scipy==1.15.1
  - numba==0.61.2
  - torch==2.6.0
  - scikit-learn
  - pillow
  - pycuda==2025.1
  - torchvision

profile::freeipa::mokey::enable_user_signup: true
profile::freeipa::mokey::require_verify_admin: false

profile::accounts::skel_archives:
  - filename: cache.zip
    source: https://github.com/calculquebec/.cache/releases/download/v1/cache-v1.zip
  - filename: jupyter.zip
    source: https://github.com/calculquebec/jupyterlab-settings/releases/download/v1.0.1/jupyter-v1.0.1.zip
  - filename: cip101-exercices.zip
    source: https://github.com/calculquebec/cip101-exercices/archive/refs/heads/main.zip
  - filename: shell-lesson-data.zip
    source: https://swcarpentry.github.io/shell-novice/data/shell-lesson-data.zip
  - filename: cq-formation-cip202.zip
    source: https://github.com/calculquebec/cq-formation-cip202/archive/refs/heads/main.zip
  - filename: cq-formation-cip201.zip
    source: https://github.com/calculquebec/cq-formation-cip201/archive/refs/heads/main.zip
  - filename: cq-formation-dat201.zip
    source: https://github.com/calculquebec/cq-formation-dat201/archive/refs/heads/main.zip
  - filename: cq-formation-dask.zip
    source: https://github.com/calculquebec/cq-formation-dask/archive/refs/heads/main.zip
  - filename: cq-formation-mpi201.zip
    source: https://github.com/calculquebec/cq-formation-mpi201/archive/refs/heads/main.zip
  - filename: cq-intro-python-gpu.zip
    source: https://github.com/calculquebec/cq-intro-python-gpu/archive/refs/heads/main.zip
  - filename: intro-machine-learning.zip
    source: https://github.com/calculquebec/intro-machine-learning/archive/refs/heads/master.zip
  - filename: cq-formation-convolution.zip
    source: https://github.com/calculquebec/cq-formation-convolution/archive/refs/heads/main.zip
  - filename: cq-formation-ecoulement-chaleur.zip
    source: https://github.com/calculquebec/cq-formation-ecoulement-chaleur/archive/refs/heads/main.zip
  - filename: cq-formation-nbody.zip
