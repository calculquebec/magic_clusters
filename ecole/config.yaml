  - filename: intro-machine-learning.zip
    source: https://github.com/calculquebec/intro-machine-learning/archive/refs/heads/master.zip
  - filename: pyt101.zip
    source: https://github.com/calculquebec/pyt101/archive/refs/heads/main.zip
  - filename: pyt102.zip
    source: https://github.com/calculquebec/pyt102/archive/refs/heads/main.zip
  - filename: dat203.zip
    source: https://github.com/calculquebec/dat203/archive/refs/heads/main.zip
  - filename: ia101.zip
    source: https://github.com/calculquebec/ia102/archive/refs/heads/master.zip
  - filename: ia103.zip
    source: https://github.com/calculquebec/ia103/archive/refs/heads/master.zip
  - filename: intro-apprentissage-IA.zip
    source: https://github.com/calculquebec/intro-apprentissage-IA/archive/refs/heads/main.zip


cron::job:
  spawn_cpu_nodes:
    command: "/opt/software/slurm/bin/scontrol update node=cpupool[1-15] state=power_up"
    minute: '0'
    hour: '8'
    date: '2,3,4,5'
    month: '6'
    weekday: '*'
    user: 'root'
    description: 'spawn cpu nodes'
    environment: ['CRON_TZ=America/New_York']
  spawn_all_nodes:
    command: "/opt/software/slurm/bin/scontrol update node=ALL state=power_up"
    minute: '0'
    hour: '8'
    date: '2,3,4,5'
    month: '6'
    weekday: '*'
    user: 'root'
    description: 'spawn all nodes'
    environment: ['CRON_TZ=America/New_York']
