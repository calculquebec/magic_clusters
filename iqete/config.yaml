jupyterhub::jupyterhub_config_hash:
    SbatchForm:
        nprocs:
            def: 2
            max: 4
        memory:
            def: 3072
            max: 3072
        gpus:
            def: 'gpu:1g.5gb:1'
            choices: ['gpu:0', 'gpu:1g.5gb:1']
        oversubscribe:
            def: false
            lock: true
        ui:
            def: 'lab'  # ['notebook', 'lab', 'terminal']
    SlurmFormSpawner:
        disable_form: false
        start_timeout: 900

jupyterhub::kernel::venv::packages: ['aiohttp', 'fsspec', 'h5py', 'pennylane==0.45.0', 'numpy', 'pandas', 'matplotlib', 'pennylane_calculquebec==0.8.2', 'qiskit==2.3.1', 'qiskit_calculquebec==0.2.0', 'qiskit_ibm_runtime==0.43.1', 'mitiq==1.0.0']

