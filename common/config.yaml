magic_castle::site::tags:
  formation_extra:
    - formation_extra
    - cron

lookup_options:
  jupyterhub::kernel::venv::pip_environment:
    merge: deep
  jupyterhub::jupyterhub_config_hash:
    merge: deep
  profile::accounts::skel_archives:
    merge: deep
  profile::users::ldap::users:
    merge: deep
  profile::software_stack::lmod_default_modules:
    merge: deep

# StdEnv/2023 and mii are automatically loaded
profile::software_stack::lmod_default_modules:
    - jupyterlab-apps/1.0

jupyterhub::node::install_method: 'none'
jupyterhub::node::install::prefix: /cvmfs/soft.computecanada.ca/easybuild/software/2023/x86-64-v3/Core/jupyterhub_node/6.8.2
jupyterhub::kernel::venv::kernel_name: 'ospython'
jupyterhub::kernel::venv::display_name: 'Python bundle'

jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    account:
      def: 'def-sponsor00'
    runtime:
      min: 3.5
      def: 4.0
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 1
    memory:
      min: 1024
      max: 2048
      def: 2048
    oversubscribe:
      def: true
      lock: true
    ui:
      def: 'lab'
  SlurmFormSpawner:
    disable_form: true
    start_timeout: 900
    http_timeout: 300

jupyterhub::enable_otp_auth: false
jupyterhub::admin_groups: ['helper']
# For TF cloud, password is pre-set from variable
profile::users::ldap::users:
  user:
    count: 200
    passwd: "%{alias('passwd_user')}"
    groups: ['def-sponsor00']

  instructor:
    count: 3
    passwd: "%{alias('passwd_instructor')}"
    groups: ['def-sponsor00', 'helper']

  helper:
    count: 9
    passwd: "%{alias('passwd_helper')}"
    groups: ['def-sponsor00', 'helper']

  'mboisson':
    count: 1
    passwd: ENC[PKCS7,]
    groups: ['def-sponsor00', 'admins']
  'helene':
    count: 1
    passwd: ENC[PKCS7,]
    groups: ['def-sponsor00', 'admins']

profile::freeipa::mokey::enable_user_signup: false
profile::nfs::server::enable_client_quotas: true

profile::slurm::base::slurm_version: '24.11'
profile::slurm::base::suspend_time: 7200
profile::slurm::base::resume_timeout: 7200
profile::slurm::base::suspend_rate: 80
profile::slurm::base::resume_rate: 80

profile::software_stack::lmod_default_modules: ['StdEnv/2023', 'jupyterlab-apps/1.0', 'mii']
jupyterhub::kernel::venv::pip_environment:
  PIP_NO_INDEX: 1
jupyterhub::kernel::venv::kernel_name: 'ospython'
jupyterhub::kernel::venv::display_name: 'Python bundle'

profile::accounts::skel_archives:
  - filename: cache.zip
    source: https://github.com/calculquebec/.cache/releases/download/v1/cache-v1.zip
  - filename: jupyter.zip
    source: https://github.com/calculquebec/jupyterlab-settings/releases/download/v1.0.1/jupyter-v1.0.1.zip

prometheus::global_config:
  scrape_interval: '1m'
  scrape_timeout: '1m'
  external_labels:
    cluster: "%{alias('cluster_name')}"
    cloud: "%{alias('cloud_name')}"
    team: 'calculquebec'
    purpose: "%{alias('cluster_purpose')}"
    replica: '1'

prometheus::remote_write_configs:
  - url: 'https://thanos-receive.dant.computecanada.ca/api/v1/receive'
    basic_auth:
      username: 'cqformation'
      password: "%{alias('prometheus_password')}"


# automatically spawn all pool nodes if there is a course in the next 30 minutes
formation_extra::google_calendar_id: "%{alias('google_calendar_id')}"
formation_extra::google_api_key: "%{alias('google_api_key')}"
formation_extra::course: "%{alias('cluster_name')}"
cron::job:
  spawn_nodes:
    command: "/usr/sbin/is_event_soon.py --delay 30 --config /etc/cq_event_check.ini || /opt/software/slurm/bin/scontrol update node=ALL state=power_up"
    minute: '*/15'
    hour: '*'
    date: '*'
    month: '*'
    weekday: '*'
    user: 'root'
    description: 'spawn nodes'
    environment: ['CRON_TZ=America/New_York']
