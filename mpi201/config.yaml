jupyterhub::jupyterhub_config_hash:
    SbatchForm:
        memory:
            max: 1024
            def: 1024
        partition:
            def: 'node'
            lock: true

profile::software_stack::lmod_default_modules: ['StdEnv/2020', 'gcc/9', 'openmpi/4.0.3', 'boost-mpi/1.72.0']

profile::accounts::skel_archives:
