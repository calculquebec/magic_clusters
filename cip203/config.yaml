jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    nprocs:
      def: 2
      max: 2
    memory:
      max: 20000
      def: 20000
    gpus:
      def: 'gpu:1g.5gb:1'
      choices: ['gpu:1g.5gb:1']

jupyterhub::kernel::venv::packages:
  - cupy
  - torch
  - numpy
profile::freeipa::mokey::enable_user_signup: false
profile::freeipa::mokey::require_verify_admin: false
profile::software_stack::lmod_default_modules:
  - gcc
  - cuda/12.2
profile::accounts::skel_archives:
    - filename: main.zip
      source: https://github.com/calculquebec/cip203/archive/refs/heads/main.zip
    - filename: cache.zip
      source: https://github.com/calculquebec/.cache/releases/download/v1/cache-v1.zip
    - filename: jupyter.zip
      source: https://github.com/calculquebec/jupyterlab-settings/releases/download/v1.0.1/jupyter-v1.0.1.zip
