jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    account:
      def: 'def-sponsor00'
    runtime:
      min: 3.5
      def: 4.0
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 1
    memory:
      min: 1024
      max: 8192
      def: 8192
    oversubscribe:
      def: true
      lock: true
    ui:
      def: 'lab'
  SlurmFormSpawner:
    disable_form: true

jupyterhub::kernel::venv::packages: ['pennylane==0.40.0', 'numpy', 'pandas', 'matplotlib', 'pennylane-calculquebec==0.6.0']

profile::software_stack::lmod_default_modules: ['StdEnv/2023', 'python/3.11', 'jupyterlab-apps/1.0']

profile::accounts::skel_archives:
  - filename: formation-CRIM.zip
    source: https://github.com/jugeoCQ/formation-CRIM/archive/refs/heads/main.zip
  - filename: cache.zip
    source: https://github.com/calculquebec/.cache/releases/download/v1/cache-v1.zip
  - filename: jupyter.zip
    source: https://github.com/calculquebec/jupyterlab-settings/releases/download/v1.0.1/jupyter-v1.0.1.zip
