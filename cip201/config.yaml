jupyterhub::jupyterhub_config_hash:
    SbatchForm:
        account:
            def: 'def-sponsor00'
        runtime:
            min: 3.5
            def: 4.0
            max: 5.0
        nprocs:
            min: 1
            def: 1
            max: 1
        memory:
            min: 1024
            max: 1024
            def: 1024
        oversubscribe:
            def: true
            lock: true
        partition:
            def: 'nodecpu'
            lock: true
        ui:
            def: 'terminal'
    SlurmFormSpawner:
        disable_form: true

profile::software_stack::lmod_default_modules: ['StdEnv/2023', 'mii']

profile::slurm::base::suspend_time: 7200
profile::slurm::base::resume_timeout: 7200

profile::accounts::skel_archives:
    - filename: cq-formation-cip201-main.zip
      source: https://github.com/calculquebec/cq-formation-cip201/archive/refs/heads/main.zip

formation_extra::stripped_skel_archives:
    - filename: cip20x_skel_extra.tar.gz
      source: https://github.com/calculquebec/formation_skels/archive/refs/heads/cip20x.tar.gz
