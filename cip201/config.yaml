jupyterhub::jupyterhub_config_hash:
    SbatchForm:
        memory:
            max: 1024
            def: 1024
        partition:
            def: 'cpu'
        ui:
            def: 'terminal'

profile::software_stack::lmod_default_modules: ['StdEnv/2023', 'mii', 'jupyterlab-apps/1.0']
profile::software_stack::initial_profile: '$HOME/.bashrc.custom'


profile::accounts::skel_archives:
    - filename: cip201-main.zip
      source: https://github.com/calculquebec/cip201/archive/refs/heads/main.zip

formation_extra::stripped_skel_archives:
    - filename: cip20x_skel_extra.tar.gz
      source: https://github.com/calculquebec/formation_skels/archive/refs/heads/cip20x.tar.gz
