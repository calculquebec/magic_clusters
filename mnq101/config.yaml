jupyterhub::jupyterhub_config_hash:
  SbatchForm:
    account:
      def: 'def-sponsor00'
    runtime:
      min: 3.5
      def: 4.0
      max: 5.0
    nprocs:
      min: 1
      def: 1
      max: 1
    memory:
      min: 1024
      max: 4098
      def: 4098
    oversubscribe:
      def: true
      lock: true
    ui:
      def: 'lab'
  SlurmFormSpawner:
    disable_form: true

jupyterhub::kernel::venv::packages: ['pennylane==0.39.0', 'numpy', 'pandas', 'matplotlib', 'pennylane-calculquebec==0.5.5']

profile::software_stack::lmod_default_modules: ['StdEnv/2023', 'python/3.11']

profile::accounts::skel_archives:
  - filename: mnq101-premiers-pas-MonarQ.zip
    source: https://github.com/calculquebec/mnq101-premiers-pas-MonarQ/archive/refs/heads/main.zip
  - filename: cache.zip
    source: https://github.com/calculquebec/.cache/releases/download/v1/cache-v1.zip
  - filename: jupyter.zip
    source: https://github.com/calculquebec/jupyterlab-settings/releases/download/v1/jupyter-v1.zip

cron::job:
  spawn_nodes:
    command: "/usr/sbin/is_event_soon.py --apikey %{lookup('google_api_key')} --calendar_id %{lookup('google_calendar_id')} --delay 30 --course %{lookup('cluster_name')} || /opt/software/slurm/bin/scontrol update node=ALL state=power_up"
    minute: '*/15'
    hour: '*'
    date: '*'
    month: '*'
    weekday: '*'
    user: 'root'
    description: 'spawn nodes'
    environment: ['CRON_TZ=America/New_York']
